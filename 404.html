<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting to Order Tracker...</title>
  
  <!-- Tailwind CSS for a smooth fallback display -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script>
    // GitHub Pages Single Page Application (SPA) Routing Hack
    // This script intercepts paths like yourdomain.com/tracker/7K2B9X4 
    // and seamlessly reroutes them to the index.html?id=7K2B9X4
    
    (function() {
      const pathSegments = window.location.pathname.split('/').filter(Boolean);
      const lastSegment = pathSegments[pathSegments.length - 1];
      
      // If the last part of the URL is a 7-character code, redirect to the tracker
      if (lastSegment && lastSegment.length === 7) {
        window.location.replace('/?id=' + lastSegment);
      } else {
        // Otherwise, just go to the homepage
        window.location.replace('/');
      }
    })();
  </script>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen antialiased">
  <div class="text-center">
    <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-orange-500 border-t-transparent mb-4"></div>
    <p class="text-slate-600 font-medium tracking-wide">Loading your tracking data...</p>
  </div>
</body>
</html>
