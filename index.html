  <style>
    html { -webkit-text-size-adjust: 100%; }
    body { background: #faf8f7; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    /* "Laal paar" border: the red-bordered white sari of Durga Puja */
    .paar { height: 10px; background: linear-gradient(#9a2607 0 6px, #fff 6px 8px, #9a2607 8px 10px); }
    .card-shadow { box-shadow: 0 1px 2px rgba(61,14,2,.06), 0 10px 28px -14px rgba(61,14,2,.22); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    :focus-visible { outline: 2px solid #9a2607; outline-offset: 2px; }
    input:focus-visible { outline: none; }
    .order-code { letter-spacing: .08em; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>

<body class="font-sans text-stone-800 min-h-screen flex flex-col selection:bg-brand-600 selection:text-white">

  <!-- Header -->
  <header class="bg-white/95 backdrop-blur border-b border-brand-100 sticky top-0 z-40">
    <div class="paar" aria-hidden="true"></div>
    <div class="max-w-3xl mx-auto px-4 h-16 sm:h-[72px] flex items-center justify-between gap-3">
      <div class="flex items-center gap-3 min-w-0">
        <img data-brand="logo" alt="" width="52" height="52" class="w-11 h-11 sm:w-[52px] sm:h-[52px] flex-shrink-0" />
        <div class="min-w-0">
          <p class="font-serif font-bold text-brand-700 text-[15px] sm:text-lg leading-snug truncate" data-i18n="brand"></p>
          <p class="text-xs sm:text-[13px] text-stone-500 leading-tight" data-i18n="tracker"></p>
        </div>
      </div>
      <button id="langToggleBtn" type="button" class="flex-shrink-0 inline-flex items-center gap-2 px-3.5 py-2 rounded-full border border-brand-200 bg-white text-sm font-semibold text-brand-700 hover:bg-brand-50 transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M3 5h12M9 3v2m1.05 9.5A18 18 0 016.4 9m6.1 9h7M11 21l5-10 5 10M12.75 5C11.78 10.77 8.07 15.61 3 18.13"></path></svg>
        <span id="langLabel">English</span>
      </button>
    </div>
  </header>

  <main class="flex-grow max-w-3xl w-full mx-auto px-4 py-6 sm:py-10 space-y-6">

    <!-- Search -->
    <form id="searchForm" class="bg-white rounded-2xl border border-brand-100 card-shadow p-4 sm:p-5" autocomplete="off" novalidate>
      <label for="orderSearchInput" class="block text-sm font-semibold text-stone-800" data-i18n="codeLabel"></label>
      <div class="mt-2.5 flex flex-col sm:flex-row sm:items-start gap-3">
        <div class="flex-1 min-w-0">
        <div class="relative">
          <svg class="w-5 h-5 text-brand-300 absolute left-4 top-1/2 -translate-y-1/2 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>

      const clean = orderId.trim().toUpperCase();
      if (clean.length !== 7) return false;
      for (const ch of clean) { if (!CHARSET.includes(ch)) return false; }
      let sum1 = 0, sum2 = 0;
      for (let i = 0; i < 5; i++) {
        const val = CHARSET.indexOf(clean[i]);
        sum1 += val * W1[i];
        sum2 += val * W2[i];
      }
      const c1 = sum1 % 32;
      const c2 = (sum2 + c1 * 31) % 32;
      return clean[5] === CHARSET[c1] && clean[6] === CHARSET[c2];
    }

    const SIZE_ORDER = ['child12', 's', 'm', 'l', 'xl', 'xxl', 'xxxl'];
    const SIZE_LABELS = {
      bn: { child12: 'শিশু (১-২ বছর)', s: 'ছোট (S)', m: 'মাঝারি (M)', l: 'বড় (L)', xl: 'অতিরিক্ত বড় (XL)', xxl: 'ডাবল এক্সএল (2XL)', xxxl: 'ট্রিপল এক্সএল (3XL)' },
      en: { child12: 'Child (1-2y)', s: 'Small (S)', m: 'Medium (M)', l: 'Large (L)', xl: 'Extra Large (XL)', xxl: 'Double XL (2XL)', xxxl: 'Triple XL (3XL)' }
    };

    let currentLang = 'bn';
    try { if (localStorage.getItem('lang') === 'en') currentLang = 'en'; } catch (e) {}

    function setLanguage(lang) {
      currentLang = lang;
      const t = i18n[lang];
      document.documentElement.lang = lang;
      document.title = (lang === 'bn' ? 'অর্ডার ট্র্যাকার | ' : 'Order Tracker | ') + t.brand;
      document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t[el.getAttribute('data-i18n')] || ''; });

      document.querySelectorAll('.js-lost-wa').forEach(a => { a.href = 'https://wa.me/' + SUPPORT_INTL + '?text=' + encodeURIComponent(t.lostWa); });
      document.getElementById('langLabel').textContent = lang === 'en' ? 'বাংলা' : 'English';
      try { localStorage.setItem('lang', lang); } catch (e) {}
    }

    document.getElementById('currentYear').textContent = new Date().getFullYear();

    /* ---------- Helpers ---------- */
    const fmtNum = (n) => Number(n).toLocaleString(currentLang === 'bn' ? 'bn-BD' : 'en-US');
    const fmtDate = (ms) => {
      const loc = currentLang === 'bn' ? 'bn-BD' : 'en-GB';
      const d = new Date(ms);
      return d.toLocaleDateString(loc, { day: 'numeric', month: 'short', year: 'numeric' }) + ' • ' +
             d.toLocaleTimeString(loc, { hour: '2-digit', minute: '2-digit' });
    };
    const maskPhone = (raw) => raw ? String(raw).replace(/\d(?=\d{4})/g, (m, i, str) => (i >= str.length - 8 ? '*' : m)) : 'N/A';

    // "qtyXL", "XL", "xl" -> "xl";  "2XL" -> "xxl";  "3XL" -> "xxxl"
    const normKey = (k) => {
      let n = String(k).replace(/^qty/i, '').replace(/[^a-z0-9]/gi, '').toLowerCase();
      if (n === '2xl') n = 'xxl';
      if (n === '3xl') n = 'xxxl';
      if (n === 'child' || n === 'child1' || n === 'child2') n = 'child12';
      return n;
    };

    // One place that turns a database record into everything the page and the invoice show.
    function buildView(order) {
      const found = {};
      const addSizes = (obj, strict) => {
        Object.keys(obj).forEach(k => {
          const v = Number(obj[k]);
          if (isNaN(v) || v <= 0) return;
          const nk = normKey(k);
          if (strict || SIZE_ORDER.includes(nk) || /^qty/i.test(k)) found[nk] = (found[nk] || 0) + v;
        });
      };
      if (order.sizes && typeof order.sizes === 'object') addSizes(order.sizes, true);   // orders/<id>/sizes
      else addSizes(order, false);                                                       // old flat records

      const keys = Object.keys(found).sort((a, b) => {
        const ia = SIZE_ORDER.indexOf(a), ib = SIZE_ORDER.indexOf(b);
        return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
      });
      const labels = SIZE_LABELS[currentLang];
      const rows = keys.map(k => ({ key: k, label: labels[k] || k.toUpperCase(), qty: found[k] }));
      const sumQty = rows.reduce((a, r) => a + r.qty, 0);

      const unitPrice = Number(order.unitPrice) || 0;
      const storedQty = Number(order.totalQuantity) || 0;
      const storedAmount = Number(order.totalAmount) || 0;
      const totalQty = sumQty > 0 ? sumQty : storedQty;
      const grandTotal = storedAmount > 0 ? storedAmount : totalQty * unitPrice;

      let status = String(order.status || 'UNDER_PROCESSING').toUpperCase();
      if (status === 'CONFIRMED') status = 'PAID';

      return {
        rows, totalQty, unitPrice, grandTotal, status,
        isPaid: status === 'PAID' || status === 'DELIVERED',
        name: order.customerName || 'Customer',
        phone: maskPhone(order.customerPhone || order.mobileNumber || ''),
        note: String(order.notes || order.note || '').trim(),
        createdAt: order.createdAt || order.updatedAt || 0
      };
    }

    /* ---------- States ---------- */
    const states = ['stateEmpty', 'stateLoading', 'stateInvalid', 'stateError', 'statePendingSync', 'stateLoaded']
      .reduce((o, id) => (o[id] = document.getElementById(id), o), {});
    function showState(name) {
      Object.keys(states).forEach(k => states[k].classList.toggle('hidden', k !== name));
      document.getElementById('lostCodeBox').classList.toggle('hidden', name !== 'stateEmpty' && name !== 'stateInvalid');
    }

    let currentUnsubscribe = null;
    let loadedOrderData = null;
    let currentOrderId = null;
    let lastTracked = '';

    // Hidden test code for checking the layout without a database record
    function generateMockData(orderId) {
      const statuses = ['UNDER_PROCESSING', 'PAID', 'DELIVERED', 'CANCELLED'];
      return {
        orderId, customerName: "Devotee Name", mobileNumber: "+8801799999999", unitPrice: 350,
        sizes: { qtyChild12: 1, qtyS: 1, qtyM: 2, qtyL: 1, qtyXL: 1, qtyXXL: 0, qtyXXXL: 0 },
        status: statuses[Math.floor(Math.random() * statuses.length)],
        createdAt: Date.now() - 86400000, note: "Please deliver before the Puja starts."
      };
    }

    function trackOrder(orderIdRaw) {
      if (!orderIdRaw) return;
      const orderId = orderIdRaw.trim().toUpperCase();
      document.getElementById('orderSearchInput').value = orderId;
      lastTracked = orderId;
      refreshCodeUI();
      loadedOrderData = null;
      currentOrderId = null;
      if (currentUnsubscribe) { currentUnsubscribe(); currentUnsubscribe = null; }
      showState('stateLoading');

      if (orderId === 'DEMO123') {
        setTimeout(() => {
          loadedOrderData = generateMockData(orderId);
          currentOrderId = orderId;
          renderOrderDetails(loadedOrderData, orderId);
          showState('stateLoaded');
        }, 500);
        return;
      }

      if (!validateOrderId(orderId)) {
        setTimeout(() => showState('stateInvalid'), 400);
        return;
      }

      try { history.replaceState(null, '', '?id=' + orderId); } catch (e) {}
      document.getElementById('txtPendingOrderId').textContent = orderId;
      document.getElementById('txtLoadedOrderId').textContent = orderId;

      currentUnsubscribe = onValue(ref(db, 'orders/' + orderId), (snapshot) => {
        if (!snapshot.exists()) {
          showState('statePendingSync');
        } else {
          loadedOrderData = snapshot.val();
          currentOrderId = orderId;
          renderOrderDetails(loadedOrderData, orderId);
          showState('stateLoaded');
        }
      }, (error) => {
        console.error("Firebase listen error:", error);
        showState('stateError');
      });
    }

    /* ---------- Order page ---------- */
    const DOT_BASE = "w-10 h-10 rounded-full flex items-center justify-center transition-all duration-500 ";
    const DOT = {
      idle:   DOT_BASE + "bg-stone-100 text-stone-400 border-4 border-white",
      done:   DOT_BASE + "bg-brand-600 text-white border-4 border-white",
      active: DOT_BASE + "bg-brand-600 text-white border-4 border-white ring-4 ring-brand-100",
      final:  DOT_BASE + "bg-emerald-600 text-white border-4 border-white ring-4 ring-emerald-100"
    };
    const LBL_BASE = "mt-2.5 block text-[12px] sm:text-sm leading-tight transition-colors ";
    const LBL = {
      idle:   LBL_BASE + "font-medium text-stone-400",
      done:   LBL_BASE + "font-semibold text-brand-700",
      active: LBL_BASE + "font-bold text-brand-700",
      final:  LBL_BASE + "font-bold text-emerald-700"
    };
    const BADGE_BASE = "inline-block px-3.5 py-1.5 rounded-full text-sm font-semibold border ";
    const BADGE = {
      UNDER_PROCESSING: BADGE_BASE + "bg-amber-50 text-amber-800 border-amber-200",
      PAID:             BADGE_BASE + "bg-emerald-50 text-emerald-800 border-emerald-200",
      DELIVERED:        BADGE_BASE + "bg-emerald-600 text-white border-emerald-600",
      CANCELLED:        BADGE_BASE + "bg-stone-100 text-stone-600 border-stone-300"
    };

    function renderOrderDetails(order, orderId) {
      const t = i18n[currentLang];
      const v = buildView(order);

      document.getElementById('txtLoadedOrderId').textContent = orderId;
      document.getElementById('btnWhatsApp').href = 'https://wa.me/' + SUPPORT_INTL + '?text=' + encodeURIComponent(t.waMsg + ' ' + orderId);
      document.getElementById('txtOrderPlacedTime').textContent = v.createdAt ? fmtDate(v.createdAt) : '';
      document.getElementById('txtCustomerName').textContent = v.name;
      document.getElementById('txtCustomerPhone').textContent = v.phone;

      // Status badge + stepper
      const badge = document.getElementById('txtCurrentStatusBadge');
      const bar = document.getElementById('stepperProgressBar');
      const dots = [1, 2, 3, 4].map(i => document.getElementById('stepDot' + i));
      const lbls = [1, 2, 3, 4].map(i => document.getElementById('lblStep' + i));
      const setStep = (i, kind) => { dots[i].className = DOT[kind]; lbls[i].className = LBL[kind]; };
      [0, 1, 2, 3].forEach(i => setStep(i, 'idle'));
      document.getElementById('bannerCancelled').classList.add('hidden');

      const statusKey = BADGE[v.status] ? v.status : 'UNDER_PROCESSING';
      badge.className = BADGE[statusKey];
      if (v.status === 'CANCELLED') {
        badge.textContent = t.statusCancelled;
        document.getElementById('bannerCancelled').classList.remove('hidden');
        bar.style.width = '0%';
        setStep(0, 'done');
      } else if (v.status === 'DELIVERED') {
        badge.textContent = t.statusDelivered;
        bar.style.width = '75%';
        setStep(0, 'done'); setStep(1, 'done'); setStep(2, 'done'); setStep(3, 'final');
      } else if (v.status === 'PAID') {
        badge.textContent = t.statusPaid;
        bar.style.width = '50%';
        setStep(0, 'done'); setStep(1, 'done'); setStep(2, 'active');
      } else {
        badge.textContent = t.statusProcessing;
        bar.style.width = '25%';
        setStep(0, 'done'); setStep(1, 'active');
      }

      // Paid stamp on the page
      document.getElementById('pageStamp').classList.toggle('hidden', !v.isPaid);

      // Sizes
      const tbody = document.getElementById('tblSizeBreakdownRows');
      tbody.innerHTML = '';
      v.rows.forEach(r => {
        const tr = document.createElement('tr');
        const td1 = document.createElement('td');
        td1.className = 'py-3 text-stone-700';
        td1.textContent = r.label;
        const td2 = document.createElement('td');
        td2.className = 'py-3 text-right font-bold text-stone-900';
        td2.textContent = fmtNum(r.qty) + ' ';
        const u = document.createElement('span');
        u.className = 'text-stone-400 text-xs font-normal';
        u.textContent = t.pcs;
        td2.appendChild(u);
        tr.append(td1, td2);
        tbody.appendChild(tr);
      });

      document.getElementById('txtTableTotal').textContent = fmtNum(v.totalQty);
      document.getElementById('txtUnitPrice').textContent = fmtNum(v.unitPrice);
      document.getElementById('txtTotalQuantity').textContent = fmtNum(v.totalQty);
      document.getElementById('txtGrandTotal').textContent = fmtNum(v.grandTotal);

      // Note
      const noteBox = document.getElementById('containerOrderNote');
      if (v.note) { document.getElementById('txtOrderNote').textContent = v.note; noteBox.classList.remove('hidden'); }
      else noteBox.classList.add('hidden');

      // Invoice is not offered for cancelled orders
      document.getElementById('btnInvoice').classList.toggle('hidden', v.status === 'CANCELLED');
    }

    /* ---------- Invoice (drawn in the browser, saved as PDF) ---------- */
    const INV = {
      title: ['ইনভয়েস', 'Invoice'],
      orderNo: ['অর্ডার নং', 'Order no.'],
      date: ['তারিখ', 'Date'],
      billedTo: ['গ্রাহকের তথ্য', 'Billed to'],
      payment: ['পেমেন্ট', 'Payment'],
      orderStatus: ['অর্ডারের অবস্থা', 'Order status'],
      paid: ['পরিশোধিত', 'Paid'],
      due: ['পরিশোধ বাকি', 'Payment due'],
      size: ['সাইজ', 'Size'],
      qty: ['পরিমাণ', 'Qty'],
      unit: ['একক মূল্য', 'Unit price'],
      amount: ['টাকা', 'Amount'],
      totalItems: ['মোট টি-শার্ট', 'Total T-shirts'],
      total: ['সর্বমোট', 'Total'],
      note: ['বিশেষ নোট', 'Note'],
      dueNote: ['পরিশোধের জন্য কমিটির সাথে যোগাযোগ করুন', 'Please contact the committee to pay'],
      thanks: ['আপনার অর্ডারের জন্য ধন্যবাদ', 'Thank you for your order'],
      track: ['অর্ডার ট্র্যাক করুন', 'Track your order'],
      auto: ['এটি কম্পিউটারে তৈরি ইনভয়েস, স্বাক্ষরের প্রয়োজন নেই।', 'This is a computer-generated invoice and needs no signature.']
    };

    const RUST = '#9a2607';
    const SANS = '"Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif';
    const SERIF = '"Noto Serif Bengali","Hind Siliguri",Georgia,serif';

    const loadImage = (src) => new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = reject;
      img.src = src;
    });

    async function ensureFonts() {
      try {
        await Promise.all([
          document.fonts.load('400 16px "Hind Siliguri"', 'অআ Aa'),
          document.fonts.load('500 16px "Hind Siliguri"', 'অআ Aa'),
          document.fonts.load('600 16px "Hind Siliguri"', 'অআ Aa'),
          document.fonts.load('700 16px "Hind Siliguri"', 'অআ Aa'),
          document.fonts.load('700 24px "Noto Serif Bengali"', 'অআ Aa')
        ]);
        await document.fonts.ready;
      } catch (e) { /* fall back to whatever font is available */ }
    }

    async function drawInvoice(order, orderId) {
      const v = buildView(order);
      const bn = currentLang === 'bn';
      const t = i18n[currentLang];
      const [logo, stamp] = await Promise.all([loadImage(window.BRAND.logo), v.isPaid ? loadImage(window.BRAND.stamp) : null]);
      await ensureFonts();

      const W = 794, H = 1123, S = 2, M = 48;
      const cv = document.createElement('canvas');
      cv.width = W * S; cv.height = H * S;
      const c = cv.getContext('2d');
      c.scale(S, S);
      c.fillStyle = '#ffffff';
      c.fillRect(0, 0, W, H);

      const T = (s, x, y, font, color, align) => {
        c.font = font; c.fillStyle = color; c.textAlign = align || 'left'; c.textBaseline = 'alphabetic';
        c.fillText(s, x, y);
      };
      const width = (s, font) => { c.font = font; return c.measureText(s).width; };
      const rrect = (x, y, w, h, r) => {
        c.beginPath();
        c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
        c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
      };
      const hline = (y, color, x1, x2) => { c.fillStyle = color; c.fillRect(x1 === undefined ? M : x1, y, (x2 === undefined ? W - M : x2) - (x1 === undefined ? M : x1), 1); };
      const both = (pair) => pair[0] + ' / ' + pair[1];

      // Red border bands (top and bottom)
      c.fillStyle = RUST;
      c.fillRect(0, 0, W, 10); c.fillRect(0, 14, W, 3);
      c.fillRect(0, H - 17, W, 3); c.fillRect(0, H - 10, W, 10);

      // Letterhead
      c.drawImage(logo, M, 40, 92, 92);
      T(i18n.bn.brand, 156, 78, '700 24px ' + SERIF, RUST);
      T(i18n.en.brand, 156, 102, '500 13px ' + SANS, '#57534e');
      T(i18n.bn.place + '   |   ' + SUPPORT_LOCAL, 156, 126, '400 13px ' + SANS, '#57534e');

      T(INV.title[0], W - M, 76, '700 30px ' + SERIF, RUST, 'right');
      T(INV.title[1], W - M, 98, '500 13px ' + SANS, '#78716c', 'right');
      T(both(INV.orderNo) + ': ' + orderId, W - M, 124, '600 13px ' + SANS, '#292524', 'right');
      if (v.createdAt) {
        const d = new Date(v.createdAt);
        const ds = d.toLocaleDateString(bn ? 'bn-BD' : 'en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
        T(both(INV.date) + ': ' + ds, W - M, 144, '400 13px ' + SANS, '#57534e', 'right');
      }
      hline(166, '#e7e0dc');

      // Customer + payment
      T(both(INV.billedTo), M, 198, '600 12px ' + SANS, RUST);
      T(v.name, M, 226, '600 20px ' + SANS, '#1c1917');
      T(v.phone, M, 250, '400 14px ' + SANS, '#57534e');

      T(both(INV.payment), W - M, 198, '600 12px ' + SANS, RUST, 'right');
      const payText = v.isPaid ? both(INV.paid) : both(INV.due);
      const payFont = '700 14px ' + SANS;
      const pw = width(payText, payFont) + 32;
      rrect(W - M - pw, 208, pw, 32, 16);
      c.fillStyle = v.isPaid ? '#ecfdf5' : '#fffbeb'; c.fill();
      c.lineWidth = 1; c.strokeStyle = v.isPaid ? '#6ee7b7' : '#fcd34d'; c.stroke();
      T(payText, W - M - pw / 2, 229, payFont, v.isPaid ? '#047857' : '#b45309', 'center');
      const statusName = { UNDER_PROCESSING: t.statusProcessing, PAID: t.statusPaid, DELIVERED: t.statusDelivered, CANCELLED: t.statusCancelled }[v.status] || t.statusProcessing;
      T(both(INV.orderStatus) + ': ' + statusName, W - M, 262, '400 12.5px ' + SANS, '#57534e', 'right');

      // Items table
      const y0 = 292, HEAD = 48, ROW = 46;
      const colQty = 470, colUnit = 604, colAmt = W - M - 14;
      c.fillStyle = '#fdf4f0'; c.fillRect(M, y0, W - 2 * M, HEAD);
      hline(y0, '#f2c2ae'); hline(y0 + HEAD, '#f2c2ae');
      const head = (pair, x, align) => {
        T(pair[0], x, y0 + 21, '700 13px ' + SANS, '#292524', align);
        T(pair[1], x, y0 + 38, '400 10.5px ' + SANS, '#78716c', align);
      };
      head(['#', ''], M + 14, 'left');
      head(INV.size, M + 50, 'left');
      head(INV.qty, colQty, 'right');
      head(INV.unit, colUnit, 'right');
      head(INV.amount, colAmt, 'right');

      v.rows.forEach((r, i) => {
        const top = y0 + HEAD + i * ROW;
        const base = top + 29;
        T(fmtNum(i + 1), M + 14, base, '400 14px ' + SANS, '#78716c');
        T(r.label, M + 50, base, '500 15px ' + SANS, '#1c1917');
        T(fmtNum(r.qty), colQty, base, '500 15px ' + SANS, '#1c1917', 'right');
        T('৳' + fmtNum(v.unitPrice), colUnit, base, '400 15px ' + SANS, '#44403c', 'right');
        T('৳' + fmtNum(r.qty * v.unitPrice), colAmt, base, '600 15px ' + SANS, '#1c1917', 'right');
        hline(top + ROW - 1, '#f1ece9');
      });
      const tableEnd = y0 + HEAD + v.rows.length * ROW;
      hline(tableEnd, '#d6cdc8');

      // Totals
      const ty = tableEnd + 22;
      T(both(INV.totalItems), 430, ty + 16, '400 14px ' + SANS, '#57534e');
      T(fmtNum(v.totalQty), W - M - 14, ty + 16, '600 14px ' + SANS, '#1c1917', 'right');
      rrect(430, ty + 32, W - M - 430, 56, 10);
      c.fillStyle = RUST; c.fill();
      T(both(INV.total), 448, ty + 66, '600 15px ' + SANS, '#ffffff');
      T('৳' + fmtNum(v.grandTotal), W - M - 16, ty + 70, '700 26px ' + SERIF, '#ffffff', 'right');

      let bottomOfBody = ty + 100;
      if (v.isPaid) {
        // The temple seal as a PAID stamp
        const cx = 190, cy = ty + 86, size = 176;
        c.save();
        c.translate(cx, cy); c.rotate(-12 * Math.PI / 180);
        c.globalCompositeOperation = 'multiply';
        c.globalAlpha = 0.92;
        c.drawImage(stamp, -size / 2, -size / 2, size, size);
        c.globalAlpha = 1;
        c.globalCompositeOperation = 'source-over';
        const label = INV.paid[0] + '  •  PAID';
        const lf = '700 18px ' + SERIF;
        const lw = width(label, lf) + 30;
        rrect(-lw / 2, size / 2 + 6, lw, 36, 8);
        c.fillStyle = '#ffffff'; c.fill();
        c.lineWidth = 2.5; c.strokeStyle = RUST; c.stroke();
        T(label, 0, size / 2 + 31, lf, RUST, 'center');
        c.restore();
        bottomOfBody = cy + size / 2 + 92;
      } else {
        rrect(M, ty + 32, 340, 56, 10);
        c.fillStyle = '#fffbeb'; c.fill();
        c.lineWidth = 1; c.strokeStyle = '#fcd34d'; c.stroke();
        T(INV.dueNote[0], M + 16, ty + 56, '600 13.5px ' + SANS, '#92400e');
        T(INV.dueNote[1] + ': ' + SUPPORT_LOCAL, M + 16, ty + 76, '400 11.5px ' + SANS, '#92400e');
      }

      // Note
      if (v.note) {
        const ny = Math.max(bottomOfBody, ty + 120);
        T(both(INV.note), M, ny, '600 12px ' + SANS, RUST);
        const words = v.note.split(/\s+/); let line = '', yy = ny + 22;
        words.forEach(w => {
          const test = line ? line + ' ' + w : w;
          if (width(test, '400 14px ' + SANS) > W - 2 * M && line) { T(line, M, yy, '400 14px ' + SANS, '#44403c'); yy += 22; line = w; }
          else line = test;
        });
        if (line) T(line, M, yy, '400 14px ' + SANS, '#44403c');
      }

      // Footer
      hline(H - 134, '#e7e0dc');
      T(both(INV.thanks), W / 2, H - 104, '600 15px ' + SANS, '#292524', 'center');
      const trackUrl = (location.protocol.startsWith('http') ? location.origin + location.pathname : 'https://podderpara.shop/') + '?id=' + orderId;
      T(both(INV.track) + ': ' + trackUrl, W / 2, H - 80, '400 12.5px ' + SANS, '#57534e', 'center');
      T(both(INV.auto), W / 2, H - 56, '400 11.5px ' + SANS, '#78716c', 'center');
      T(i18n.bn.brand + '  |  ' + i18n.bn.place + '  |  ' + SUPPORT_LOCAL, W / 2, H - 36, '500 11.5px ' + SANS, RUST, 'center');

      return cv;
    }

    // Minimal PDF writer: one A4 page holding the invoice image
    function makePdf(jpegBytes, w, h, title) {
      const enc = new TextEncoder();
      const parts = [];
      const offsets = [];
      let len = 0;
      const push = (u8) => { parts.push(u8); len += u8.length; };
      const str = (s) => push(enc.encode(s));
      const obj = (n, body) => { offsets[n] = len; str(n + ' 0 obj\n' + body + '\nendobj\n'); };

      str('%PDF-1.4\n');
      obj(1, '<< /Type /Catalog /Pages 2 0 R >>');
      obj(2, '<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
      obj(3, '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 5 0 R >> >> /Contents 4 0 R >>');
      const content = 'q 595.28 0 0 841.89 0 0 cm /Im0 Do Q';
      obj(4, '<< /Length ' + content.length + ' >>\nstream\n' + content + '\nendstream');
      offsets[5] = len;
      str('5 0 obj\n<< /Type /XObject /Subtype /Image /Width ' + w + ' /Height ' + h +
          ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + jpegBytes.length + ' >>\nstream\n');
      push(jpegBytes);
      str('\nendstream\nendobj\n');
      obj(6, '<< /Title (' + title + ') /Producer (Poddarpara Order Tracker) >>');
      const xref = len;
      str('xref\n0 7\n0000000000 65535 f \n');
      for (let i = 1; i <= 6; i++) str(String(offsets[i]).padStart(10, '0') + ' 00000 n \n');
      str('trailer\n<< /Size 7 /Root 1 0 R /Info 6 0 R >>\nstartxref\n' + xref + '\n%%EOF');
      return new Blob(parts, { type: 'application/pdf' });
    }

    async function downloadInvoice() {
      if (!loadedOrderData || !currentOrderId) return;
      const btn = document.getElementById('btnInvoice');
      const label = document.getElementById('lblInvoiceBtn');
      const errBox = document.getElementById('txtInvoiceError');
      const t = i18n[currentLang];
      errBox.classList.add('hidden');
      btn.disabled = true;
      label.textContent = t.invoiceBusy;
      try {
        const cv = await drawInvoice(loadedOrderData, currentOrderId);
        const jpeg = await new Promise((res, rej) => cv.toBlob(b => b ? res(b) : rej(new Error('toBlob failed')), 'image/jpeg', 0.93));
        const bytes = new Uint8Array(await jpeg.arrayBuffer());
        const pdf = makePdf(bytes, cv.width, cv.height, 'Invoice ' + currentOrderId);
        const url = URL.createObjectURL(pdf);
        const a = document.createElement('a');
        a.href = url; a.download = 'Invoice-' + currentOrderId + '.pdf';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 30000);
        label.textContent = t.invoiceDone;
      } catch (e) {
        console.error('Invoice error:', e);
        errBox.textContent = t.invoiceErr;
        errBox.classList.remove('hidden');
        label.textContent = t.invoiceBtn;
      }
      setTimeout(() => { btn.disabled = false; label.textContent = i18n[currentLang].invoiceBtn; }, 1600);
    }

    /* ---------- Wiring ---------- */
    function getOrderIdFromUrl() {
      const params = new URLSearchParams(window.location.search);
      const queryId = params.get('id') || params.get('order');
      if (queryId) return queryId;
      const segs = window.location.pathname.split('/').filter(Boolean);
      const last = segs[segs.length - 1];
      return last && last.length === 7 ? last : null;
    }

    /* ---------- Code entry: live checks, forgiving input ---------- */
    const codeInput = document.getElementById('orderSearchInput');
    const codeCounter = document.getElementById('codeCounter');
    const codeHint = document.getElementById('codeHint');
    const codeSegs = Array.from(document.querySelectorAll('#codeSegments span'));
    const BN_DIGITS = '০১২৩৪৫৬৭৮৯';

    // Accepts "7k2b9x4", "৭k২b৯x৪", " 7K2-B9X4 " or a pasted link containing ?id=7K2B9X4
    function sanitizeCode(raw) {
      let v = String(raw).replace(/[০-৯]/g, d => String(BN_DIGITS.indexOf(d)));
      const q = v.match(/[?&](?:id|order)=([A-Za-z0-9]+)/i);
      if (q) v = q[1];
      else if (v.includes('/')) {
        const last = v.split(/[\/?#]/).filter(Boolean).pop() || '';
        if (/^[A-Za-z0-9]{7}$/.test(last)) v = last;
      }
      return v.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 7);
    }

    function evalCode(code) {
      if (!code.length) return { kind: 'idle' };
      const bad = Array.from(new Set(code.split('').filter(ch => !CHARSET.includes(ch))));
      if (bad.length) return { kind: 'badchar', bad };
      if (code.length < 7) return { kind: 'typing' };
      return { kind: validateOrderId(code) ? 'valid' : 'mismatch' };
    }

    function setHint(text, tone) {
      codeHint.textContent = text;
      codeHint.className = 'mt-2.5 text-sm min-h-[1.25rem] ' +
        (tone === 'warn' ? 'text-amber-800' : tone === 'ok' ? 'text-emerald-700 font-medium' : 'text-stone-500');
    }

    function refreshCodeUI() {
      const t = i18n[currentLang];
      const code = codeInput.value;
      const r = evalCode(code);
      codeCounter.textContent = fmtNum(code.length) + '/' + fmtNum(7);
      codeSegs.forEach((seg, i) => {
        let tone = 'bg-stone-200';
        if (i < code.length) {
          if (r.kind === 'valid') tone = 'bg-emerald-500';
          else if (r.kind === 'mismatch' || (r.kind === 'badchar' && !CHARSET.includes(code[i]))) tone = 'bg-amber-500';
          else tone = 'bg-brand-600';
        }
        seg.className = 'h-1.5 rounded-full transition-colors ' + tone;
      });
      if (r.kind === 'idle') setHint(t.hintIdle, 'info');
      else if (r.kind === 'typing') setHint(t.hintTyping.replace('{n}', fmtNum(7 - code.length)), 'info');
      else if (r.kind === 'badchar') setHint(t.hintBadChar.replace('{c}', r.bad.join(', ')), 'warn');
      else if (r.kind === 'mismatch') setHint(t.hintMismatch, 'warn');
      else setHint(t.hintValid, 'ok');
      return r;
    }

    codeInput.addEventListener('input', () => {
      const clean = sanitizeCode(codeInput.value);
      if (clean !== codeInput.value) codeInput.value = clean;
      const r = refreshCodeUI();
      // A complete, correct code is looked up straight away
      if (r.kind === 'valid' && clean !== lastTracked) { trackOrder(clean); codeInput.blur(); }
    });

    document.getElementById('searchForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const code = sanitizeCode(codeInput.value);
      codeInput.value = code;
      if (code === 'DEMO123' || code.length === 7) { trackOrder(code); codeInput.blur(); }
      else { refreshCodeUI(); setHint(i18n[currentLang].hintShort, 'warn'); codeInput.focus(); }
    });

    document.getElementById('langToggleBtn').addEventListener('click', () => {
      setLanguage(currentLang === 'en' ? 'bn' : 'en');
      if (loadedOrderData && currentOrderId) renderOrderDetails(loadedOrderData, currentOrderId);
      refreshCodeUI();
    });

    document.getElementById('btnInvoice').addEventListener('click', downloadInvoice);

    document.getElementById('btnCopyLink').addEventListener('click', async () => {
      if (!currentOrderId) return;
      const url = location.origin + location.pathname + '?id=' + currentOrderId;
      const lbl = document.getElementById('lblCopyLink');
      try { await navigator.clipboard.writeText(url); lbl.textContent = i18n[currentLang].copied; }
      catch (e) { window.prompt('Link:', url); }
      setTimeout(() => { lbl.textContent = i18n[currentLang].copyLink; }, 1800);
    });

    setLanguage(currentLang);
    refreshCodeUI();
    const initialId = getOrderIdFromUrl();
    if (initialId) trackOrder(initialId);
  </script>
</body>
